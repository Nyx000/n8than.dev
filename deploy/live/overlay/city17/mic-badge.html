<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Overwatch comms badge</title>
<style>
  :root{
    --slate: rgba(10,17,24,.86);
    --frost: #d6f1ff;
    --scan:  #7fd6ff;
    --resist:#ff6600;
  }
  html,body{background:transparent;margin:0;overflow:hidden}
  body{
    width:512px;height:48px;position:relative;
    font-family:"Bahnschrift","Segoe UI",sans-serif;
    color:var(--frost);
    -webkit-font-smoothing:antialiased;
  }
  .badge{
    position:absolute;inset:0;background:var(--slate);overflow:hidden;
    clip-path:polygon(0 0, 494px 0, 512px 18px, 512px 48px, 18px 48px, 0 30px);
  }
  /* orange resistance strip on the leading edge */
  .badge::before{content:"";position:absolute;left:0;top:0;height:30px;width:4px;background:var(--resist)}
  .outline{position:absolute;inset:0;pointer-events:none}

  .mic{position:absolute;left:24px;top:12px;width:24px;height:24px}
  .label{position:absolute;left:58px;top:7px;font-size:20px;font-weight:600;letter-spacing:.02em;line-height:22px}
  .sub{position:absolute;left:58px;top:28px;font-size:13px;letter-spacing:.03em;color:var(--scan);font-stretch:75%}

  /* transmit bars: decorative carrier, not a real level meter */
  .bars{position:absolute;left:214px;right:96px;top:12px;height:24px;display:flex;align-items:center;justify-content:space-between}
  .bars i{display:block;width:3px;height:24px;border-radius:1.5px;background:var(--scan);
    transform:scaleY(.3);transform-origin:center;opacity:.9;
    animation:carrier 1.3s ease-in-out infinite alternate;will-change:transform}
  .bars i:nth-child(3n){background:var(--frost)}
  @keyframes carrier{from{transform:scaleY(.28)}to{transform:scaleY(var(--h,.8))}}

  .ch{position:absolute;right:20px;top:9px;text-align:right}
  .ch .k{display:block;font-size:12px;letter-spacing:.04em;opacity:.55;font-stretch:75%}
  .ch .v{display:block;font-size:18px;font-weight:300;letter-spacing:.06em;line-height:20px;font-variant-numeric:tabular-nums}

  @media (prefers-reduced-motion: reduce){
    .bars i{animation:none;transform:scaleY(var(--h,.6))}
  }
</style>
</head>
<body>
  <div class="badge">
    <svg class="mic" viewBox="0 0 24 24" aria-hidden="true">
      <rect x="8.5" y="2.5" width="7" height="12" rx="3.5" fill="#ff6600"/>
      <path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3.5M8.5 21.5h7" fill="none" stroke="#ff6600" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <div class="label">Comms open</div>
    <div class="sub">Nyx000 transmitting</div>
    <div class="bars" id="bars"></div>
    <svg class="outline" width="512" height="48" viewBox="0 0 512 48" aria-hidden="true">
      <polygon points="0.5,0.5 493.8,0.5 511.5,18.2 511.5,47.5 18.2,47.5 0.5,29.8" fill="none" stroke="rgba(60,85,102,.95)"/>
      <polyline points="0.5,0.5 493.8,0.5 511.5,18.2" fill="none" stroke="rgba(127,214,255,.7)"/>
      <polyline points="18.2,47.5 0.5,29.8" fill="none" stroke="#ff6600" stroke-width="2"/>
    </svg>
    <div class="ch"><span class="k">Channel</span><span class="v">17.00</span></div>
  </div>
<script>
(() => {
  const bars = document.getElementById("bars");
  const heights = [.35,.6,.9,.55,.75,1,.5,.8,.4,.95,.6,.7,.45,.85,.55,.65,.3,.75,.5,.4];
  heights.forEach((h, i) => {
    const b = document.createElement("i");
    b.style.setProperty("--h", h);
    b.style.animationDelay = (-(i * 0.37) % 1.3).toFixed(2) + "s";
    b.style.animationDuration = (1.0 + (i % 4) * 0.18).toFixed(2) + "s";
    bars.appendChild(b);
  });
})();
</script>
</body>
</html>
