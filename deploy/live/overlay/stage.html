<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Overwatch stage</title>
<style>
  :root{
    --slate: rgba(10,17,24,.58);
    --steel: #3c5566;
    --frost: #d6f1ff;
    --scan:  #7fd6ff;
    --resist:#ff6600;
    --amber: #ffb24a;
  }
  html,body{background:transparent;margin:0;overflow:hidden}
  body{
    width:1920px;height:1080px;position:relative;
    font-family:"Bahnschrift","Segoe UI",sans-serif;
    color:var(--frost);
    font-variant-numeric:tabular-nums;
    -webkit-font-smoothing:antialiased;
  }
  .panel{
    position:absolute;
    background:var(--slate);
    clip-path:polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 12px 100%, 0 calc(100% - 12px));
    box-shadow:inset 0 1px 0 rgba(127,214,255,.4), inset 0 0 0 1px rgba(60,85,102,.6);
  }

  /* ---------- dispatch ticker, top-left (clear of compass and hero row) ---------- */
  .dispatch{left:100px;top:14px;width:220px;height:48px;opacity:.9}
  .dispatch::after{content:"";position:absolute;left:0;top:24px;width:3px;height:17px;background:var(--resist);opacity:.9}
  .dispatch .code{
    position:absolute;left:12px;top:6px;
    font-size:11px;letter-spacing:.14em;color:var(--scan);
    font-stretch:75%;
  }
  .dispatch .code b{font-weight:600;color:var(--frost);opacity:.55}
  .dispatch .line{
    position:absolute;left:12px;right:10px;top:23px;
    font-size:16px;line-height:19px;white-space:nowrap;overflow:hidden;
    font-stretch:87.5%;
    transition:opacity .45s ease, transform .45s ease;
  }
  .dispatch .line.out{opacity:0;transform:translateY(-4px)}
  .dispatch .pip{
    position:absolute;right:10px;top:8px;width:6px;height:6px;border-radius:50%;
    background:var(--scan);box-shadow:0 0 6px var(--scan);
    animation:pip 2.4s steps(1,end) infinite;
  }
  @keyframes pip{0%,70%{opacity:1}71%,100%{opacity:.15}}

  /* ---------- station ident, top-right ---------- */
  .ident{left:1620px;top:14px;width:284px;height:52px;opacity:.92}
  .slats{position:absolute;left:12px;top:10px;height:32px;display:flex;gap:3px;align-items:flex-end}
  .slats i{display:block;width:3px;background:linear-gradient(var(--scan),rgba(127,214,255,.15));border-radius:1px}
  .slats i:nth-child(1){height:18px}.slats i:nth-child(2){height:26px}
  .slats i:nth-child(3){height:32px}.slats i:nth-child(4){height:26px}.slats i:nth-child(5){height:18px}
  .ident .name{
    position:absolute;left:44px;top:7px;font-size:21px;font-weight:600;letter-spacing:.02em;line-height:22px;
  }
  .ident .sub{
    position:absolute;left:44px;top:29px;font-size:13px;color:var(--scan);letter-spacing:.03em;
    font-stretch:75%;
  }
  .ident .clock{
    position:absolute;right:12px;top:8px;text-align:right;
    font-size:21px;line-height:22px;font-weight:300;letter-spacing:.04em;
  }
  .ident .date{
    position:absolute;right:12px;top:30px;font-size:12px;color:var(--frost);opacity:.55;letter-spacing:.1em;
    font-stretch:75%;
  }

  @media (prefers-reduced-motion: reduce){
    .dispatch .pip{animation:none}
    .dispatch .line{transition:none}
  }
</style>
</head>
<body>
  <div class="panel dispatch">
    <div class="code">C17 <b>/</b> DISPATCH</div>
    <div class="line" id="line">Sector 7 under observation</div>
    <div class="pip"></div>
  </div>

  <div class="panel ident">
    <div class="slats"><i></i><i></i><i></i><i></i><i></i></div>
    <div class="name">City 17</div>
    <div class="sub">Nyx000 on patrol</div>
    <div class="clock" id="clock">00:00</div>
    <div class="date" id="date">00.00.00</div>
  </div>

<script>
(() => {
  const lines = [
    "Sector 7 under observation",
    "Remain in your assigned lane",
    "Anticitizen reported, mid lane",
    "Souls are not contraband. Yet.",
    "Unit Nyx000 reporting in",
    "Lambda sighting logged",
    "Loitering near urns is noted",
    "Compliance is appreciated",
  ];
  const lineEl = document.getElementById("line");
  const clockEl = document.getElementById("clock");
  const dateEl = document.getElementById("date");
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const pad = n => String(n).padStart(2, "0");
  let i = 0;

  function tick(){
    const d = new Date();
    clockEl.textContent = pad(d.getHours()) + ":" + pad(d.getMinutes());
    dateEl.textContent = pad(d.getDate()) + "." + pad(d.getMonth() + 1) + "." + String(d.getFullYear()).slice(2);
  }
  function next(){
    i = (i + 1) % lines.length;
    if (still){ lineEl.textContent = lines[i]; return; }
    lineEl.classList.add("out");
    setTimeout(() => { lineEl.textContent = lines[i]; lineEl.classList.remove("out"); }, 460);
  }
  tick();
  setInterval(tick, 1000);
  setInterval(next, 8000);
})();
</script>
</body>
</html>
