<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Black Mesa webcam frame</title>
<!--
  Observation window: the webcam monitor, 304 x 214, hole 288 x 162 (16:9) at page 8,26.
  Sits directly under the info console of stage.html (same width, right edges aligned): OBS position 1604,164.
-->
<style>
  :root{
    --console: #c4ba9f;         /* lab console enamel */
    --console-lo: #978e74;
    --ink:   #2a2620;
    --glass: #050402;
    --phos:  #ffae2e;           /* amber phosphor */
    --phos-dim: rgba(255,174,46,.55);
    --hev:   #ffa21f;
    --warn:  #ff6600;
    --stripe:#f0b400;
    /* webcam hole, page coordinates: 288x162 (16:9) at 8,26 */
    --hx:8px; --hy:26px; --hw:288px; --hh:162px;
  }
  html,body{background:transparent;margin:0;overflow:hidden}
  body{
    width:304px;height:214px;position:relative;
    font-family:"Bahnschrift","Segoe UI",sans-serif;
    color:var(--phos);
    font-variant-numeric:tabular-nums;
    -webkit-font-smoothing:antialiased;
  }

  /* Everything lives inside .unit. Its even-odd clip removes the hole, so no
     background, glow or scanline can ever paint over the camera. */
  .unit{position:absolute;inset:0;
    clip-path:path(evenodd,"M6 0H298Q304 0 304 6V208Q304 214 298 214H6Q0 214 0 208V6Q0 0 6 0Z M8 26H296V188H8Z");
    background:linear-gradient(#d2c8ad, var(--console) 14%, var(--console-lo));
  }

  /* CRT glass, inset in the console bezel; the hole is cut out of it */
  .glass{position:absolute;left:4px;top:4px;width:296px;height:206px;border-radius:5px;background:var(--glass);
    box-shadow:0 0 0 1px rgba(0,0,0,.55)}
  .glass::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:5px;
    background:repeating-linear-gradient(to bottom, rgba(255,174,46,.05) 0 1px, transparent 1px 3px)}

  /* top band: recording timecode, anti-mass spectrometer power */
  .rec{position:absolute;left:12px;top:7px;height:16px;display:flex;align-items:center;gap:6px}
  .rec .dot{width:8px;height:8px;border-radius:50%;background:var(--warn);box-shadow:0 0 6px var(--warn);
    animation:blink 1.6s steps(1,end) infinite}
  .rec .lbl{font-size:12px;font-weight:700;letter-spacing:.14em;color:var(--warn);font-stretch:87.5%}
  .rec .tc{font-size:19px;line-height:16px;font-weight:700;font-stretch:75%;color:var(--hev);
    text-shadow:0 0 6px rgba(255,140,0,.5)}
  @keyframes blink{0%,62%{opacity:1}63%,100%{opacity:.12}}

  .pwrbar{position:absolute;right:12px;top:7px;height:16px;display:flex;align-items:center;gap:7px}
  .pl{font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--phos-dim);font-stretch:87.5%;margin-right:-1px}
  .pwr{display:flex;gap:2px}
  .pwr i{width:6px;height:10px;background:var(--phos);opacity:.14;border-radius:1px}
  .pwr i.on{opacity:.85;box-shadow:0 0 4px rgba(255,150,20,.5)}
  .pwr i.hot{background:var(--warn);opacity:1}
  .pct{font:13px/16px Consolas,"Lucida Console",monospace;color:var(--phos-dim);text-shadow:0 0 4px rgba(255,150,20,.45)}
  .pct b{font-weight:400;color:var(--phos)}
  .pwrbar.alarm .pct b,.pwrbar.alarm .pl{color:var(--warn)}

  /* bottom band: caution panel, terminal readout, lamps */
  .caution{position:absolute;left:12px;top:195px;width:44px;height:9px;
    background:repeating-linear-gradient(-45deg, var(--stripe) 0 4px, #141210 4px 8px);
    box-shadow:0 0 0 1px rgba(0,0,0,.45)}
  .term{position:absolute;left:64px;right:52px;top:192px;height:16px;display:flex;align-items:center;
    font:13px/16px Consolas,"Lucida Console",monospace;white-space:nowrap;overflow:hidden;
    text-shadow:0 0 4px rgba(255,150,20,.5)}
  .term .k{color:var(--phos-dim)}
  .term .v{margin-left:6px}
  .term.alarm .k,.term.alarm .v{color:var(--warn);text-shadow:0 0 5px rgba(255,102,0,.6)}
  .lamps{position:absolute;right:12px;top:195px;display:flex;gap:6px}
  .lamps i{width:9px;height:9px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.5)}
  .lamps .a{background:var(--phos)}
  .lamps .w{background:#5a2a10}

  @media (prefers-reduced-motion: reduce){
    .rec .dot{animation:none}
  }
</style>
</head>
<body>
  <div class="unit">
    <div class="glass"></div>

    <div class="rec"><span class="dot"></span><span class="lbl">REC</span><span class="tc" id="tc">00:00:00</span></div>
    <div class="pwrbar" id="pwrbar"><span class="pl">PWR</span><div class="pwr" id="pwr"></div><span class="pct"><b id="pct">000</b>%</span></div>

    <i class="caution"></i>
    <div class="term" id="term"><span class="k" id="k">Subject</span><span class="v" id="v">vitals nominal</span></div>
    <div class="lamps"><i class="a"></i><i class="w" id="wl"></i></div>
  </div>

<script>
(() => {
  const tc = document.getElementById("tc");
  const term = document.getElementById("term");
  const pwrbar = document.getElementById("pwrbar");
  const k = document.getElementById("k");
  const v = document.getElementById("v");
  const pct = document.getElementById("pct");
  const pwr = document.getElementById("pwr");
  const wl = document.getElementById("wl");
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const pad = n => String(n).padStart(2, "0");
  const t0 = Date.now();

  const SEG = 12;
  const segs = [];
  for (let s = 0; s < SEG; s++){ const i = document.createElement("i"); pwr.appendChild(i); segs.push(i); }

  const states = [
    ["Subject", "vitals nominal"],
    ["Sample cart", "in position"],
    ["Resonance", "98.6%"],
    ["Lanes", "questionable"],
    ["Shutdown", "not responding"],
  ];
  let n = 0;

  // spectrometer spool: climbs past 100% over ~100 s, runs hot for 16 s
  // (the one alarm moment: warn lamp, hot segments, cascade line), then resets
  const CLIMB = 100, CYCLE = 116;
  let alarm = false;
  function power(sec){
    const p = still ? 100 : Math.min(105, Math.floor((sec % CYCLE) / CLIMB * 105));
    pct.textContent = String(p).padStart(3, "0");
    const lit = Math.round(Math.min(p, 100) / 100 * SEG);
    for (let s = 0; s < SEG; s++){
      segs[s].className = s < lit ? (p > 100 && s >= SEG - 2 ? "on hot" : "on") : "";
    }
    wl.style.background = p > 100 ? "var(--warn)" : "#5a2a10";
    const hot = p > 100;
    if (hot !== alarm){
      alarm = hot;
      term.classList.toggle("alarm", hot);
      pwrbar.classList.toggle("alarm", hot);
      if (hot){ k.textContent = ""; v.textContent = "We can't shut it down"; v.style.marginLeft = "0"; }
      else { v.style.marginLeft = ""; show(); }
    }
  }

  function tick(){
    const s = Math.floor((Date.now() - t0) / 1000);
    tc.textContent = pad(Math.floor(s / 3600)) + ":" + pad(Math.floor(s / 60) % 60) + ":" + pad(s % 60);
    power(s);
  }
  function show(){
    k.textContent = states[n][0];
    v.textContent = states[n][1];
  }
  function cycle(){
    n = (n + 1) % states.length;
    if (!alarm) show();
  }
  tick();
  setInterval(tick, 1000);
  setInterval(cycle, 9000);
})();
</script>
</body>
</html>
