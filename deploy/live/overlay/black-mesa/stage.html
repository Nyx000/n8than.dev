<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Black Mesa stage</title>
<!--
  Always-on layer of the Black Mesa overlay: ONE info console in the top-right corner.
  It sits directly above the webcam frame (webcam-frame.html), so with the cam off it is
  a corner console and with the cam on the two read as one equipment tower.
  Data: n8than.dev status/chat/now-playing + optional Deadlock match history.
  Config constants are at the top of the script. Add ?mock=1 to preview with fake data.
-->
<style>
  :root{
    --console: #c4ba9f;         /* lab console enamel (same as the webcam frame) */
    --console-lo: #978e74;
    --ink:   #2a2620;           /* engraved label ink */
    --glass: #050402;           /* CRT glass */
    --phos:  #ffae2e;           /* amber phosphor */
    --phos-dim: rgba(255,174,46,.66);
    --hev:   #ffa21f;           /* HEV suit glyph amber */
    --hev-dim: rgba(255,162,31,.72);
    --warn:  #ff6600;
    --stripe:#f0b400;           /* hazard yellow */
    --xen:   #45e0c0;           /* the one teal accent: wins */
    --bone:  #ece4cc;
  }
  html,body{background:transparent;margin:0;overflow:hidden}
  body{
    width:1920px;height:1080px;position:relative;
    font-family:"Bahnschrift","Segoe UI",sans-serif;
    color:var(--bone);
    font-variant-numeric:tabular-nums;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- the console: x 1604..1908, y 12..160 (clear of the hero row, which ends at x ~1592) ---------- */
  .info{position:absolute;left:1604px;top:12px;width:304px;height:148px;border-radius:6px 6px 4px 4px;
    background:linear-gradient(#d2c8ad, var(--console) 14%, var(--console-lo));
    box-shadow:inset 0 1px 0 rgba(255,255,255,.45), inset 0 -1px 0 rgba(0,0,0,.35), 0 1px 0 rgba(0,0,0,.5)}
  .plate{position:absolute;left:10px;top:2px;height:16px;display:flex;align-items:baseline;gap:9px;
    color:var(--ink);font-stretch:87.5%;text-shadow:0 1px 0 rgba(255,255,255,.3)}
  .plate b{font-size:14px;line-height:16px;font-weight:800;letter-spacing:.1em}
  .plate span{font-size:10px;line-height:16px;font-weight:700;letter-spacing:.14em;opacity:.78}
  .hz{position:absolute;right:10px;top:4px;width:48px;height:9px;
    background:repeating-linear-gradient(-45deg, var(--stripe) 0 4px, #111 4px 8px);
    box-shadow:0 0 0 1px rgba(0,0,0,.45)}

  .glass{position:absolute;left:6px;right:6px;top:18px;bottom:6px;background:var(--glass);border-radius:4px;overflow:hidden;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.8), inset 0 2px 5px rgba(0,0,0,.9)}
  .glass::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(to bottom, rgba(255,174,46,.06) 0 1px, transparent 1px 3px)}

  /* top of the glass: two faces on the same 50px strip. live = three gauges, idle = the suit's own readout */
  .faces{position:absolute;left:0;right:0;top:0;height:50px;border-bottom:1px solid rgba(255,174,46,.18)}
  .face{position:absolute;inset:0;transition:opacity .4s}
  .faces[data-face="live"] .idle,.faces[data-face="idle"] .live{opacity:0}

  .live{display:grid;grid-template-columns:114px 70px 1fr}
  .tile{min-width:0;padding:3px 0 0 10px}
  .tile + .tile{border-left:1px solid rgba(255,174,46,.16)}
  .num{font-size:32px;line-height:32px;font-weight:700;font-stretch:75%;white-space:nowrap;
    color:var(--hev);text-shadow:0 0 7px rgba(255,140,0,.45)}
  .lbl{display:flex;align-items:center;gap:6px;margin-top:1px;height:14px;
    font-size:13px;line-height:14px;color:var(--hev-dim);font-stretch:87.5%;letter-spacing:.04em;white-space:nowrap}
  .lamp{flex:none;width:7px;height:7px;border-radius:50%;background:var(--warn);box-shadow:0 0 5px var(--warn)}
  .w{color:var(--xen);text-shadow:0 0 7px rgba(69,224,192,.4)}
  .l{color:var(--warn);text-shadow:0 0 7px rgba(255,102,0,.45)}
  .sep{opacity:.55;margin:0 1px}
  .pips{display:flex;gap:2px;margin-left:auto;padding-right:7px}
  .pips i{width:6px;height:7px;border-radius:1px;background:rgba(255,174,46,.2)}
  .pips i.w{background:var(--xen);box-shadow:none}
  .pips i.l{background:var(--warn);box-shadow:none}
  .third .m,.third .c{display:none}
  .third[data-mode="match"] .m{display:block}
  .third[data-mode="match"] .lbl.m{display:flex}
  .third[data-mode="clock"] .c{display:block}
  .third[data-mode="clock"] .lbl.c{display:flex}

  .idle .lam{position:absolute;left:11px;top:0;font:700 34px/50px "Segoe UI",sans-serif;color:var(--hev);
    text-shadow:0 0 6px rgba(255,140,0,.45)}
  .idle .who{position:absolute;left:46px;top:5px}
  .idle .name{color:var(--bone);font-size:22px;line-height:24px;font-weight:600;letter-spacing:.02em}
  .idle .sub{font-size:13px;line-height:16px;color:var(--hev-dim);letter-spacing:.04em;font-stretch:87.5%;white-space:nowrap}
  .idle .clk{position:absolute;right:10px;top:0}
  .clk,.c .num{font-size:38px;line-height:50px;font-weight:700;font-stretch:75%;color:var(--hev);text-shadow:0 0 7px rgba(255,140,0,.5)}
  .c .num{font-size:32px;line-height:32px}
  .colon{font-style:normal;animation:colon 2s steps(1,end) infinite}
  @keyframes colon{0%,49%{opacity:1}50%,100%{opacity:.25}}

  /* bottom of the glass: one card at a time, rotating */
  .card{position:absolute;left:0;right:0;top:51px;bottom:0;padding:6px 10px 0}
  .card.in{animation:cardin .3s ease-out}
  @keyframes cardin{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .ch{display:flex;align-items:center;gap:8px;height:18px}
  .tag{flex:none;height:17px;padding:0 6px;border-radius:2px;background:var(--phos);color:#1a1206;
    font:800 12px/17px "Bahnschrift","Segoe UI",sans-serif;font-stretch:87.5%;letter-spacing:.08em;text-transform:uppercase}
  .tag.w{background:var(--xen);color:#04201a;text-shadow:none}
  .tag.l{background:var(--warn);color:#1a0a00;text-shadow:none}
  .card.fresh .tag{animation:flash .45s steps(1,end) 3}
  @keyframes flash{50%{opacity:.2}}
  .meta{flex:1;min-width:0;font:14px/18px Consolas,"Lucida Console",monospace;color:var(--phos-dim);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .age{flex:none;font:13px/18px Consolas,"Lucida Console",monospace;color:var(--phos-dim)}
  .cb{margin-top:3px;font:18px/21px Consolas,"Lucida Console",monospace;color:var(--phos);
    text-shadow:0 0 4px rgba(255,150,20,.5)}
  .cb div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cb .l2{color:var(--phos-dim)}
  .cb.wrap .l1{white-space:normal;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow-wrap:anywhere}
  .cb.wrap .l2{display:none}

  @media (prefers-reduced-motion: reduce){
    .colon,.card.in,.card.fresh .tag{animation:none}
    .face{transition:none}
  }
</style>
</head>
<body>
  <div class="info">
    <div class="plate"><b>NYX000</b><span>CHAMBER C-33/a</span></div>
    <i class="hz"></i>
    <div class="glass">
      <div class="faces" id="faces" data-face="idle">
        <div class="face live">
          <div class="tile"><div class="num" id="up">0:00:00</div><div class="lbl"><i class="lamp"></i>On air</div></div>
          <div class="tile"><div class="num" id="rd">0</div><div class="lbl">Watching</div></div>
          <div class="tile third" id="third" data-mode="clock">
            <div class="num m"><span class="w" id="sw">0</span><span class="sep">-</span><span class="l" id="sl">0</span></div>
            <div class="lbl m">Session<span class="pips" id="pips"></span></div>
            <div class="num c"><span id="h2">00</span><i class="colon">:</i><span id="m2">00</span></div>
            <div class="lbl c">Streamer time</div>
          </div>
        </div>
        <div class="face idle">
          <div class="lam" aria-hidden="true">&lambda;</div>
          <div class="who"><div class="name">Nyx000</div><div class="sub">HEV suit online</div></div>
          <div class="clk"><span id="hh">00</span><i class="colon">:</i><span id="mm">00</span></div>
        </div>
      </div>
      <div class="card in" id="card">
        <div class="ch"><span class="tag" id="tag">Log</span><span class="meta" id="meta"></span><span class="age" id="age"></span></div>
        <div class="cb" id="cb"><div class="l1" id="b1"></div><div class="l2" id="b2"></div></div>
      </div>
    </div>
  </div>

<script>
(() => {
  "use strict";

  /* ================= config: the only things to edit ================= */
  const API_BASE = "https://n8than.dev";      // "" if this page is itself served from n8than.dev (same origin, no CORS needed)
  const STEAM_ACCOUNT_ID = "";                // Deadlock account: SteamID3 (the N in [U:1:N]) or SteamID64. Empty = Deadlock pieces off.
  const DEADLOCK_API = "https://api.deadlock-api.com";   // community API, sends CORS *
  const EVERY = { status: 30e3, chat: 15e3, music: 30e3, match: 420e3 };   // ms between polls (never faster)
  const LIVE_STALE_MS = 100e3;    // status older than this counts as missing
  const CHAT_MAX_AGE = 3 * 3600e3;
  const GAME_MAX_AGE = 12 * 3600e3;
  const HOLD_MS = 8000;           // how long each ticker card stays

  const FLAVOR = [       // [line, small print]: shown when there is little or no live data
    ["Beam 2 at 100%", "Anti-mass spectrometer"], ["Sample cart staged", "Awaiting subject"],
    ["Stay in your lane", "Procedure 14-B"], ["Harmonics stable", "Resonance 98.6%"],
    ["Do not lick the urn", "Containment advisory"], ["Souls are lab property", "Form 27-C on file"],
    ["Cascade risk: low-ish", "Monitoring"], ["We can't shut it down", "Escalating"],
  ];

  /* ================= data module: fetching, nothing else ================= */
  const Data = (() => {
    const q = new URLSearchParams(location.search);
    const MOCK = q.get("mock") === "1";
    const OFF = new Set((q.get("off") || "").split(","));      // mock only: off=status,chat,music,match,deadlock
    // ?steam= wins over the constant, so the ID can live in the local OBS source URL
    // instead of this public repo.
    const acct = MOCK ? (OFF.has("deadlock") ? null : "1") : toAccountId(q.get("steam") || STEAM_ACCOUNT_ID);
    const state = { status: null, chat: null, music: null, match: null, deadlock: acct !== null };
    const listeners = [];
    const heroes = new Map();
    let heroesRetryAt = 0, seenChat = 0, seenTrack = null;

    function toAccountId(raw){
      const s = String(raw || "").trim().replace(/^\[U:1:(\d+)\]$/, "$1");
      if (!/^\d{1,20}$/.test(s)) return null;
      if (s.length < 16) return s;                                // already SteamID3
      const id = BigInt(s) - 76561197960265728n;                  // SteamID64 -> SteamID3
      return id > 0n && id < 4294967296n ? String(id) : null;
    }
    // untrusted text: strip control and bidi characters, collapse whitespace, cut
    function clean(v, n){
      const s = String(v == null ? "" : v).replace(/[\u0000-\u001f\u007f\u200b-\u200f\u202a-\u202e\u2066-\u2069]+/g, " ").replace(/\s+/g, " ").trim();
      return s.length > n ? s.slice(0, n - 1) + "\u2026" : s;
    }
    async function getJSON(url, accept429){
      const ctrl = new AbortController();
      const kill = setTimeout(() => ctrl.abort(), 10000);
      try {
        const res = await fetch(url, { signal: ctrl.signal });     // plain GET, no custom headers: no preflight
        if (!res.ok && !(accept429 && res.status === 429)) throw new Error("http " + res.status);
        return await res.json();
      } finally { clearTimeout(kill); }
    }

    /* ---- mock data: realistic shapes, preview with ?mock=1 ---- */
    const T0 = Date.now();
    const iso = ms => new Date(T0 - ms).toISOString();
    const mock = {
      status: () => OFF.has("status") ? { online: false, onlineTime: null, readers: [] }
        : { online: true, onlineTime: iso(((2 * 60 + 12) * 60 + 7) * 1000),
            readers: [{ type: "webRTCSession", id: "7b1e" }, { type: "hlsMuxer", id: "c5a0" }, { type: "webRTCSession", id: "e0d3" }] },
      chat: () => OFF.has("chat") ? [] : [
        { id: 103, body: "gg that last fight was wild, the double hook into the urn steal was so clean I can't", name: "Albert", created_at: iso(4 * 60e3) },
        { id: 102, body: "lol", name: null, created_at: iso(11 * 60e3) },
      ],
      music: () => OFF.has("music") ? { isPlaying: false, track: null, fetchedAt: T0 }
        : { isPlaying: true, fetchedAt: T0, track: { id: "mock1", name: "Nightcall", artists: "Kavinsky", albumArtUrl: null, explicit: false, uri: "", durationMs: 258000 } },
      match: () => OFF.has("match") ? [] : [
        [38, 1, 7, 12, 3, 9, 2301], [82, 2, 2, 4, 9, 11, 2470], [117, 1, 6, 15, 5, 7, 2012],
        [180, 2, 8, 6, 8, 10, 2650], [225, 1, 7, 9, 2, 14, 1980], [260, 1, 10, 11, 4, 6, 2104],
      ].map(([minAgo, outcome, hero, k, d, a, dur]) => ({
        match_id: 1000 + minAgo, start_time: Math.floor((T0 - minAgo * 60e3) / 1000), player_match_outcome: outcome,
        hero_id: hero, player_kills: k, player_deaths: d, player_assists: a, match_duration_s: dur })),
      heroes: () => [{ id: 1, name: "Infernus" }, { id: 2, name: "Seven" }, { id: 6, name: "Abrams" },
                     { id: 7, name: "Wraith" }, { id: 8, name: "McGinnis" }, { id: 10, name: "Paradox" }],
    };

    /* ---- sources: load raw, apply to state (throw on a malformed payload) ---- */
    function emit(kind){ listeners.forEach(f => f(kind)); }

    const sources = {
      status: {
        every: EVERY.status,
        load: () => MOCK ? mock.status() : getJSON(API_BASE + "/api/live/status"),
        apply(d){
          if (!d || typeof d !== "object") throw new Error("status shape");
          const since = d.online === true ? Date.parse(d.onlineTime) : NaN;
          state.status = { at: Date.now(), live: Number.isFinite(since), since, readers: Array.isArray(d.readers) ? d.readers.length : 0 };
        },
      },
      chat: {
        every: EVERY.chat,
        load: () => MOCK ? mock.chat() : getJSON(API_BASE + "/api/live/chat"),
        apply(list, first){
          if (!Array.isArray(list)) throw new Error("chat shape");
          let top = null;
          for (const m of list) if (m && typeof m.body === "string" && Number.isFinite(+m.id) && (!top || +m.id > +top.id)) top = m;
          if (!top){ state.chat = null; return; }
          state.chat = { id: +top.id, name: clean(top.name, 18) || "guest", body: clean(top.body, 140), at: Date.parse(top.created_at) };
          if (state.chat.id !== seenChat){ const was = seenChat; seenChat = state.chat.id; if (!first && was) emit("chat"); }
        },
      },
      music: {
        every: EVERY.music,
        load: () => MOCK ? mock.music() : getJSON(API_BASE + "/api/spotify/now-playing"),
        apply(d, first){
          if (!d || typeof d !== "object") throw new Error("music shape");
          const t = d.isPlaying === true && d.track && typeof d.track.name === "string" ? d.track : null;
          if (!t){ state.music = null; return; }
          state.music = { id: String(t.id || t.name), name: clean(t.name, 90), artists: clean(t.artists, 90) };
          if (state.music.id !== seenTrack){ const was = seenTrack; seenTrack = state.music.id; if (!first && was !== null) emit("music"); }
        },
      },
    };
    if (acct !== null){
      sources.match = {
        every: EVERY.match,
        async load(){
          const list = MOCK ? mock.match() : await getJSON(`${DEADLOCK_API}/v1/players/${acct}/match-history`, true);
          await loadHeroes();
          return list;
        },
        apply(list){
          if (!Array.isArray(list)) throw new Error("match shape");
          state.match = { at: Date.now(), heroes, list: list.map(m => ({
            t: m.start_time * 1000, win: m.player_match_outcome === 1, loss: m.player_match_outcome === 2,
            hero: m.hero_id, k: m.player_kills | 0, d: m.player_deaths | 0, a: m.player_assists | 0, dur: m.match_duration_s | 0,
          })).filter(m => Number.isFinite(m.t)).sort((a, b) => b.t - a.t) };
        },
      };
    }
    async function loadHeroes(){
      if (heroes.size || Date.now() < heroesRetryAt) return;
      try {
        const arr = MOCK ? mock.heroes() : await getJSON(DEADLOCK_API + "/v1/assets/heroes");
        for (const h of arr) if (h && Number.isFinite(h.id) && typeof h.name === "string") heroes.set(h.id, h.name);
      } catch (e) {
        heroesRetryAt = Date.now() + 600e3;   // hero names are cosmetic: show "Hero 7" and retry in 10 min
      }
    }

    function run(name, s, delay){
      let fails = 0, first = true;
      const go = async () => {
        try {
          const wasFirst = first;
          s.apply(await s.load(), first);
          fails = 0; first = false;
          if (wasFirst) emit("first");
        } catch (e) {
          // by design nothing reaches the screen: two failures in a row drop the piece and the widget falls back to its idle face
          if (++fails >= 2) state[name] = null;
        }
        setTimeout(go, s.every);
      };
      setTimeout(go, delay);
    }
    function start(){ Object.keys(sources).forEach((k, i) => run(k, sources[k], 150 + i * 400)); }
    return { state, start, onEvent: f => listeners.push(f), heroName: id => heroes.get(id) || "Hero " + id };
  })();

  /* ================= ui ================= */
  const $ = id => document.getElementById(id);
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const pad = n => String(n).padStart(2, "0");
  const el = { faces: $("faces"), up: $("up"), rd: $("rd"), third: $("third"), sw: $("sw"), sl: $("sl"), pips: $("pips"),
    h2: $("h2"), m2: $("m2"), hh: $("hh"), mm: $("mm"),
    card: $("card"), tag: $("tag"), meta: $("meta"), age: $("age"), cb: $("cb"), b1: $("b1"), b2: $("b2") };
  const setText = (node, v) => { v = String(v); if (node.textContent !== v) node.textContent = v; };

  for (let i = 0; i < 5; i++) el.pips.appendChild(document.createElement("i"));
  const pipEls = [...el.pips.children];
  let pipKey = "";

  const fmtUp = s => { s = Math.max(0, Math.floor(s));      // always H:MM:SS so 12 minutes never reads as 12:00 o'clock
    return Math.floor(s / 3600) + ":" + pad(Math.floor(s / 60) % 60) + ":" + pad(s % 60); };
  const shortAge = ms => { const m = Math.floor(ms / 60e3); return m < 1 ? "now" : m < 60 ? m + "m" : Math.floor(m / 60) + "h"; };
  const longAge = ms => { const m = Math.floor(ms / 60e3); return m < 1 ? "just now" : m < 60 ? m + " min ago" : Math.floor(m / 60) + "h ago"; };

  // Deadlock view: session record since the broadcast started (local midnight if the start is unknown)
  function matchView(now){
    const m = Data.state.match;
    if (!m) return null;
    const st = Data.state.status;
    const d0 = new Date(now); d0.setHours(0, 0, 0, 0);
    const since = st && st.live ? st.since : d0.getTime();
    const scored = m.list.filter(g => g.win || g.loss);
    const sess = scored.filter(g => g.t >= since);
    const w = sess.filter(g => g.win).length;
    const last = m.list[0] && now - m.list[0].t < GAME_MAX_AGE ? m.list[0] : null;
    return { w, l: sess.length - w, form: scored.slice(0, 5).reverse(), last };
  }

  function render(){
    const now = Date.now(), d = new Date(now), s = Data.state.status;
    const live = !!(s && s.live && now - s.at < LIVE_STALE_MS);
    const face = live ? "live" : "idle";
    if (el.faces.dataset.face !== face) el.faces.dataset.face = face;
    setText(el.hh, pad(d.getHours())); setText(el.mm, pad(d.getMinutes()));
    if (!live) return;
    setText(el.up, fmtUp((now - s.since) / 1000));
    setText(el.rd, s.readers);
    const mv = Data.state.deadlock ? matchView(now) : null;
    const mode = mv ? "match" : "clock";
    if (el.third.dataset.mode !== mode) el.third.dataset.mode = mode;
    if (mv){
      setText(el.sw, mv.w); setText(el.sl, mv.l);
      const key = mv.form.map(g => g.win ? "w" : "l").join("");
      if (key !== pipKey){
        pipKey = key;
        pipEls.forEach((p, i) => { const g = mv.form[i - (5 - mv.form.length)]; p.className = g ? (g.win ? "w" : "l") : ""; });
      }
    } else {
      setText(el.h2, pad(d.getHours())); setText(el.m2, pad(d.getMinutes()));
    }
  }

  /* ---- ticker: one card at a time ---- */
  const ORDER = ["music", "chat", "match", "log"];
  let shown = "", fl = 0, timer = 0;
  function items(now){
    const out = [], st = Data.state;
    if (st.music) out.push({ key: "music", tag: "Now playing", cls: "", meta: "", body: [st.music.name, st.music.artists] });
    if (st.chat && Number.isFinite(st.chat.at) && now - st.chat.at < CHAT_MAX_AGE)
      out.push({ key: "chat", tag: "Chat", cls: "", meta: st.chat.name, age: shortAge(now - st.chat.at), body: [st.chat.body], wrap: true });
    const mv = st.deadlock ? matchView(now) : null;
    if (mv && mv.last){
      const g = mv.last;
      out.push({ key: "match", tag: g.win ? "Win" : g.loss ? "Loss" : "Game", cls: g.win ? "w" : g.loss ? "l" : "", meta: "Last game",
        body: [Data.heroName(g.hero) + "  " + g.k + "/" + g.d + "/" + g.a, Math.round(g.dur / 60) + " min match, " + longAge(now - g.t - g.dur * 1000)] });
    }
    if (out.length < 2)       // little or no data: the chamber talks
      out.push({ key: "log", tag: "Log", cls: "", meta: "Test chamber", body: FLAVOR[fl] });
    return out;
  }
  function show(it, fresh){
    el.tag.textContent = it.tag; el.tag.className = "tag" + (it.cls ? " " + it.cls : "");
    el.meta.textContent = it.meta || ""; el.age.textContent = it.age || "";
    el.b1.textContent = it.body[0] || ""; el.b2.textContent = it.body[1] || "";
    el.cb.classList.toggle("wrap", !!it.wrap);
    el.card.classList.toggle("fresh", fresh && !still);
    if (!still){ el.card.classList.remove("in"); void el.card.offsetWidth; el.card.classList.add("in"); }
  }
  function step(pref){
    clearTimeout(timer);
    const list = items(Date.now());
    let it = typeof pref === "string" ? list.find(x => x.key === pref) : undefined;
    const jump = !!it;
    if (!it){                 // next card after the one on screen, in fixed order, whatever data came or went
      const at = ORDER.indexOf(shown);
      it = list.find(x => ORDER.indexOf(x.key) > at) || list[0];
    }
    shown = it.key;
    show(it, jump);
    if (it.key === "log") fl = (fl + 1) % FLAVOR.length;
    timer = setTimeout(step, jump ? HOLD_MS + 2000 : HOLD_MS);
  }

  Data.onEvent(kind => {
    if (kind === "first"){      // first real data after load: leave the flavor card early
      if (shown === "log" && items(Date.now()).some(x => x.key !== "log")) step();
    } else step(kind);          // a new chat line or a new track interrupts the rotation
  });
  render();
  step();
  setInterval(render, 1000);
  Data.start();
})();
</script>
