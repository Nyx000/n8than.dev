<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Black Mesa stage</title>
<style>
  :root{
    --console: #c2b89d;         /* lab console enamel */
    --console-lo: #9d9479;
    --ink:   #2a2620;           /* engraved label ink */
    --glass: #050402;           /* CRT glass */
    --phos:  #ffae2e;           /* amber phosphor */
    --hev:   #ffa21f;           /* HEV suit glyph amber */
    --hev-dim: rgba(255,162,31,.6);
    --warn:  #ff6600;
    --stripe:#f0b400;           /* hazard yellow */
    --bone:  #ece4cc;
  }
  html,body{background:transparent;margin:0;overflow:hidden}
  body{
    width:1920px;height:1080px;position:relative;
    font-family:"Bahnschrift","Segoe UI",sans-serif;
    color:var(--bone);
    font-variant-numeric:tabular-nums;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- chamber status console, top-left (clear of compass and hero row) ---------- */
  .con{position:absolute;left:100px;top:14px;width:220px;height:52px;
    background:linear-gradient(var(--console), var(--console-lo));
    box-shadow:inset 0 1px 0 rgba(255,255,255,.45), inset 0 -1px 0 rgba(0,0,0,.35), 0 1px 0 rgba(0,0,0,.5)}
  .con .plate{position:absolute;left:8px;top:3px;font-size:10px;line-height:12px;font-weight:700;
    letter-spacing:.14em;color:var(--ink);font-stretch:87.5%}
  .con .hz{position:absolute;right:8px;top:4px;width:44px;height:9px;
    background:repeating-linear-gradient(-45deg, var(--stripe) 0 4px, #111 4px 8px);
    box-shadow:0 0 0 1px rgba(0,0,0,.45)}
  .crt{position:absolute;left:6px;right:6px;top:17px;bottom:5px;background:var(--glass);border-radius:3px;
    overflow:hidden;box-shadow:inset 0 0 0 1px rgba(0,0,0,.8), inset 0 2px 5px rgba(0,0,0,.9)}
  .crt::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(to bottom, rgba(255,174,46,.06) 0 1px, transparent 1px 3px)}
  .line{position:absolute;left:8px;right:6px;top:5px;
    font:15px/20px Consolas,"Lucida Console",monospace;color:var(--phos);white-space:nowrap;overflow:hidden;
    text-shadow:0 0 4px rgba(255,150,20,.55)}
  .line .cur{display:inline-block;width:8px;height:13px;margin-left:2px;vertical-align:-1px;background:var(--phos);
    animation:cur 1.1s steps(1,end) infinite}
  @keyframes cur{0%,55%{opacity:1}56%,100%{opacity:0}}

  /* ---------- HEV readout, top-right: the suit's HUD layer ---------- */
  .hev{position:absolute;left:1620px;top:14px;width:284px;height:52px;
    background:linear-gradient(var(--console), var(--console-lo));
    box-shadow:inset 0 1px 0 rgba(255,255,255,.45), inset 0 -1px 0 rgba(0,0,0,.35), 0 1px 0 rgba(0,0,0,.5)}
  .hev .glass{position:absolute;inset:4px;background:var(--glass);border-radius:3px;overflow:hidden;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.8), inset 0 2px 5px rgba(0,0,0,.9)}
  .hev .glass::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(to bottom, rgba(255,174,46,.06) 0 1px, transparent 1px 3px)}
  .hev .glass::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--warn)}
  .lam{position:absolute;left:11px;top:0;font:700 34px/40px "Segoe UI",sans-serif;color:var(--hev);
    text-shadow:0 0 6px rgba(255,140,0,.45)}
  .who{position:absolute;left:40px;top:3px}
  .who .name{color:var(--bone);font-size:21px;line-height:22px;font-weight:600;letter-spacing:.02em}
  .who .sub{font-size:12px;line-height:16px;color:var(--hev-dim);letter-spacing:.04em;font-stretch:87.5%;white-space:nowrap}
  .bar{position:absolute;left:174px;top:6px;width:3px;height:32px;background:var(--hev);opacity:.7}
  .clock{position:absolute;right:9px;top:0;text-align:right;
    font-size:40px;line-height:44px;font-weight:700;font-stretch:75%;letter-spacing:.01em;
    color:var(--hev);opacity:.92;text-shadow:0 0 7px rgba(255,140,0,.5)}
  .clock i{font-style:normal;animation:colon 2s steps(1,end) infinite}
  @keyframes colon{0%,49%{opacity:1}50%,100%{opacity:.25}}

  @media (prefers-reduced-motion: reduce){
    .line .cur,.clock i{animation:none}
  }
</style>
</head>
<body>
  <div class="con">
    <div class="plate">TEST CHAMBER C-33/a</div>
    <i class="hz"></i>
    <div class="crt"><div class="line"><span id="line">Beam 2 at 100%</span><i class="cur"></i></div></div>
  </div>

  <div class="hev"><div class="glass">
    <div class="lam" aria-hidden="true">&lambda;</div>
    <div class="who">
      <div class="name">Nyx000</div>
      <div class="sub">HEV suit online</div>
    </div>
    <div class="bar"></div>
    <div class="clock"><span id="hh">00</span><i>:</i><span id="mm">00</span></div>
  </div></div>

<script>
(() => {
  const lines = [
    "Beam 2 at 100%",
    "Sample cart staged",
    "Stay in your lane",
    "Harmonics stable",
    "Do not lick the urn",
    "Souls are lab property",
    "Cascade risk: low-ish",
    "We can't shut it down",
  ];
  const lineEl = document.getElementById("line");
  const hh = document.getElementById("hh");
  const mm = document.getElementById("mm");
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const pad = n => String(n).padStart(2, "0");
  let i = 0, typer = 0;

  function tick(){
    const d = new Date();
    hh.textContent = pad(d.getHours());
    mm.textContent = pad(d.getMinutes());
  }
  // console-style: the new status types out a few characters per frame
  function next(){
    i = (i + 1) % lines.length;
    const s = lines[i];
    clearInterval(typer);
    if (still){ lineEl.textContent = s; return; }
    let k = 0;
    lineEl.textContent = "";
    typer = setInterval(() => {
      k += 2;
      lineEl.textContent = s.slice(0, k);
      if (k >= s.length) clearInterval(typer);
    }, 45);
  }
  tick();
  setInterval(tick, 1000);
  setInterval(next, 8000);
})();
</script>
</body>
</html>
